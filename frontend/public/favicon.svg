<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient matching site theme: violet → cyan -->
    <linearGradient id="ufGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <!-- Subtle inner glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" ry="14" fill="#050816"/>

  <!-- Subtle violet border -->
  <rect width="64" height="64" rx="14" ry="14"
        fill="none" stroke="url(#ufGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- "UF" text with gradient fill -->
  <text
    x="32" y="44"
    font-family="'Segoe UI', Arial, sans-serif"
    font-weight="800"
    font-size="28"
    text-anchor="middle"
    fill="url(#ufGrad)"
    filter="url(#glow)"
    letter-spacing="-1"
  >UF</text>
</svg>