<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#915EFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="220" fill="#915EFF" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="240" fill="#00FFFF" opacity="0.12" filter="url(#glow)"/>

  <!-- Card Container -->
  <rect x="80" y="60" width="1040" height="510" rx="28" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(145, 94, 255, 0.3)" stroke-width="2"/>

  <!-- Brand / Logo Pill -->
  <rect x="140" y="120" width="100" height="42" rx="21" fill="rgba(145, 94, 255, 0.15)" stroke="rgba(145, 94, 255, 0.4)" stroke-width="1"/>
  <text x="190" y="148" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="url(#primaryGrad)" text-anchor="middle">UF</text>

  <!-- Status Badge -->
  <rect x="256" y="120" width="160" height="42" rx="21" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
  <circle cx="280" cy="141" r="5" fill="#22c55e"/>
  <text x="348" y="147" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="15" fill="#22c55e" text-anchor="middle">Open to Work</text>

  <!-- Name -->
  <text x="140" y="240" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    Umar Farid
  </text>

  <!-- Role Subtitle -->
  <text x="140" y="300" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="url(#primaryGrad)">
    Full Stack .NET &amp; React Developer
  </text>

  <!-- Description -->
  <text x="140" y="360" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="22" fill="#a0aec0">
    Building scalable web apps with ASP.NET Core, C#, Entity Framework &amp; React.js
  </text>

  <!-- Tech Pills -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="rgba(145, 94, 255, 0.15)" stroke="rgba(145, 94, 255, 0.4)" stroke-width="1.5"/>
    <text x="75" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#c4b5fd" text-anchor="middle">ASP.NET Core</text>

    <rect x="166" y="0" width="110" height="44" rx="22" fill="rgba(0, 255, 255, 0.12)" stroke="rgba(0, 255, 255, 0.4)" stroke-width="1.5"/>
    <text x="221" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#67e8f9" text-anchor="middle">React.js</text>

    <rect x="292" y="0" width="80" height="44" rx="22" fill="rgba(145, 94, 255, 0.15)" stroke="rgba(145, 94, 255, 0.4)" stroke-width="1.5"/>
    <text x="332" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#c4b5fd" text-anchor="middle">C#</text>

    <rect x="388" y="0" width="130" height="44" rx="22" fill="rgba(255, 107, 107, 0.12)" stroke="rgba(255, 107, 107, 0.4)" stroke-width="1.5"/>
    <text x="453" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#fca5a5" text-anchor="middle">SQL Server</text>

    <rect x="534" y="0" width="130" height="44" rx="22" fill="rgba(0, 255, 255, 0.12)" stroke="rgba(0, 255, 255, 0.4)" stroke-width="1.5"/>
    <text x="599" y="28" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="16" fill="#67e8f9" text-anchor="middle">REST APIs</text>
  </g>

  <!-- Location and Domain Footer -->
  <text x="140" y="525" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="18" fill="#718096">
    📍 Sahiwal, Pakistan  •  github.com/umarfaridse
  </text>
</svg>
